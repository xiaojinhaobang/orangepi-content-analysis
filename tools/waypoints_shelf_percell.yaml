# 逐格方案：12 个货位点（B1..B6 再 A1..A6），蛇形顺序
# 坐标单位 cm，原点=起飞点，+x=起飞时机头方向（自动生成，勿手改）
# 生成用 psi0 = 0.00 度
tolerances: {pos_cm: 25.0, z_cm: 10.0, yaw_deg: 180.0, hold_s: 2.0}
loop: false
field: {x_min: -400.0, x_max: 400.0, y_min: -400.0, y_max: 400.0}
obstacles: []
waypoints:
  - {name: takeoff, x: 0.0, y: 0.0, z: 120.0, yaw: 0.0}
  - {name: B1, x: 15.0, y: 180.0, z: 120.0, yaw: 0.0}
  - {name: B2, x: 15.0, y: 130.0, z: 120.0, yaw: 0.0}
  - {name: B3, x: 15.0, y: 80.0, z: 120.0, yaw: 0.0}
  - {name: B6, x: 15.0, y: 80.0, z: 120.0, yaw: 0.0}
  - {name: B5, x: 15.0, y: 130.0, z: 120.0, yaw: 0.0}
  - {name: B4, x: 15.0, y: 180.0, z: 120.0, yaw: 0.0}
  - {name: A1, x: 135.0, y: 80.0, z: 120.0, yaw: 0.0}
  - {name: A2, x: 135.0, y: 130.0, z: 120.0, yaw: 0.0}
  - {name: A3, x: 135.0, y: 180.0, z: 120.0, yaw: 0.0}
  - {name: A6, x: 135.0, y: 180.0, z: 120.0, yaw: 0.0}
  - {name: A5, x: 135.0, y: 130.0, z: 120.0, yaw: 0.0}
  - {name: A4, x: 135.0, y: 80.0, z: 120.0, yaw: 0.0}
  - {name: land, x: 150.0, y: 270.0, z: 120.0, yaw: 0.0}
