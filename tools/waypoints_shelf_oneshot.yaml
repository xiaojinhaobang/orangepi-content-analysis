# 一帧一拍方案：B 面 1 点 + A 面 1 点（1.0m 处一帧覆盖整面板 6 个码）
# 坐标单位 cm，原点=起飞点，+x=起飞时机头方向（自动生成，勿手改）
# 生成用 psi0 = 0.00 度
tolerances: {pos_cm: 25.0, z_cm: 10.0, yaw_deg: 180.0, hold_s: 2.0}
loop: false
field: {x_min: -400.0, x_max: 400.0, y_min: -400.0, y_max: 400.0}
obstacles: []
waypoints:
  - {name: takeoff, x: 0.0, y: 0.0, z: 120.0, yaw: 0.0}
  - {name: scan_B, x: -25.0, y: 130.0, z: 120.0, yaw: 0.0}
  - {name: scan_A, x: 175.0, y: 130.0, z: 120.0, yaw: 0.0}
  - {name: land, x: 150.0, y: 270.0, z: 120.0, yaw: 0.0}
